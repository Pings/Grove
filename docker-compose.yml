services:
  grove:
    build:
      context: .
      dockerfile: Dockerfile
    image: grove:latest
    pull_policy: build
    container_name: grove
    restart: unless-stopped
    ports:
      # Host port from .env (GROVE_PORT) so auto-updates don't wipe your custom port
      - "${GROVE_PORT:-8081}:80"
    depends_on:
      - sync

  sync:
    build: ./deploy/sync-server
    image: grove-sync:latest
    pull_policy: build
    container_name: grove-sync
    restart: unless-stopped
    ports:
      - "${SYNC_PORT:-8090}:8090"
    volumes:
      - grove-sync-data:/data

  # Public HTTPS via Cloudflare Tunnel (optional).
  # Enable with COMPOSE_PROFILES=cloudflare and TUNNEL_TOKEN in .env
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: grove-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - grove
    profiles:
      - cloudflare

volumes:
  grove-sync-data:
