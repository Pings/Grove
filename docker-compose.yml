services:
  xin:
    build:
      context: .
      dockerfile: Dockerfile
    image: xin:latest
    pull_policy: build
    container_name: xin
    restart: unless-stopped
    ports:
      # Host port from .env (XIN_PORT) so auto-updates don't wipe your custom port
      - "${XIN_PORT:-8081}:80"
    depends_on:
      - xin-sync
      - xin-covet

  xin-sync:
    build: ./deploy/sync-server
    image: xin-sync:latest
    pull_policy: build
    container_name: xin-sync
    restart: unless-stopped
    ports:
      - "${SYNC_PORT:-8090}:8090"
    volumes:
      - xin-sync-data:/data

  xin-covet:
    build: ./tools/price-tracker
    image: xin-covet:latest
    pull_policy: build
    container_name: xin-covet
    restart: unless-stopped
    environment:
      PRICES_HOST: "0.0.0.0"
      PRICES_PORT: "5050"
      PRICES_URL_PREFIX: "/covet"
      PRICES_DB: "/data/prices.db"
    volumes:
      - xin-covet-data:/data

  # Poll GitHub and rebuild app services when main moves (optional).
  # Enable with COMPOSE_PROFILES containing "watcher".
  # DEPLOY_HOST_PATH must be this stack’s absolute host path (bind-mounted at the
  # same path so `docker compose` via docker.sock resolves build context correctly).
  deploy-watcher:
    build: ./deploy/watcher
    image: xin-deploy-watcher:latest
    pull_policy: build
    container_name: xin-deploy-watcher
    restart: unless-stopped
    environment:
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-main}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      REPO_DIR: ${DEPLOY_HOST_PATH:-/mnt/Maru/Apps/Dockge/stacks/xin}
      DEPLOY_SSH_KEY: ${DEPLOY_SSH_KEY:-}
    volumes:
      - ${DEPLOY_HOST_PATH:-/mnt/Maru/Apps/Dockge/stacks/xin}:${DEPLOY_HOST_PATH:-/mnt/Maru/Apps/Dockge/stacks/xin}
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${DEPLOY_HOST_PATH:-/mnt/Maru/Apps/Dockge/stacks/xin}
    profiles:
      - watcher

  # Public HTTPS via Cloudflare Tunnel (optional).
  # Enable with COMPOSE_PROFILES=cloudflare and TUNNEL_TOKEN in .env
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: xin-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - xin
    profiles:
      - cloudflare

volumes:
  xin-sync-data:
  xin-covet-data:
