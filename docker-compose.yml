services:
  grove:
    build:
      context: .
      dockerfile: Dockerfile
    image: grove:latest
    pull_policy: build
    container_name: grove
    restart: unless-stopped
    ports:
      # Host port from .env (GROVE_PORT) so auto-updates don't wipe your custom port
      - "${GROVE_PORT:-8081}:80"
    depends_on:
      - sync

  sync:
    build: ./deploy/sync-server
    image: grove-sync:latest
    pull_policy: build
    container_name: grove-sync
    restart: unless-stopped
    ports:
      - "${SYNC_PORT:-8090}:8090"
    volumes:
      - grove-sync-data:/data

  # Poll GitHub and rebuild grove+sync when main moves (optional).
  # Enable with COMPOSE_PROFILES containing "watcher".
  # DEPLOY_HOST_PATH must be this stack’s absolute host path (bind-mounted at the
  # same path so `docker compose` via docker.sock resolves build context correctly).
  deploy-watcher:
    build: ./deploy/watcher
    image: grove-deploy-watcher:latest
    pull_policy: build
    container_name: grove-deploy-watcher
    restart: unless-stopped
    environment:
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-main}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      REPO_DIR: ${DEPLOY_HOST_PATH:-/mnt/Maru/Apps/Dockge/stacks/xin}
      DEPLOY_SSH_KEY: ${DEPLOY_SSH_KEY:-}
    volumes:
      - ${DEPLOY_HOST_PATH:-/mnt/Maru/Apps/Dockge/stacks/xin}:${DEPLOY_HOST_PATH:-/mnt/Maru/Apps/Dockge/stacks/xin}
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${DEPLOY_HOST_PATH:-/mnt/Maru/Apps/Dockge/stacks/xin}
    profiles:
      - watcher

  # Public HTTPS via Cloudflare Tunnel (optional).
  # Enable with COMPOSE_PROFILES=cloudflare and TUNNEL_TOKEN in .env
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: grove-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - grove
    profiles:
      - cloudflare

volumes:
  grove-sync-data:
