services:
  grove:
    build: .
    image: grove:latest
    container_name: grove
    restart: unless-stopped
    ports:
      - "8080:80"

  # Public HTTPS via Cloudflare Tunnel (optional).
  # Enable with COMPOSE_PROFILES=cloudflare and TUNNEL_TOKEN in .env
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: grove-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - grove
    profiles:
      - cloudflare
