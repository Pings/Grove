<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal tools — Grove and more." />
    <title>Tools</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231f5c4a'/></svg>" />
    <link rel="stylesheet" href="/hub.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Personal</p>
        <h1 class="brand">Tools</h1>
        <p class="lede">Small apps on this host. Pick one to open.</p>
      </header>

      <section class="tools" aria-label="Available tools">
        <a class="tool" href="/grove/">
          <span class="tool-name">Grove</span>
          <span class="tool-zh">培</span>
          <span class="tool-desc">Chinese vocabulary garden</span>
        </a>

        <a class="tool tool-soon" href="#prices" aria-disabled="true">
          <span class="tool-name">Prices</span>
          <span class="tool-desc">Price tracker — coming soon</span>
        </a>
      </section>
    </main>
  </body>
</html>
