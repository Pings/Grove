server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API → grove-sync (works through Cloudflare Tunnel on :80)
    location /api/ {
        proxy_pass http://sync:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location = /health {
        proxy_pass http://sync:8090/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Covet → grove-covet
    location = /covet {
        return 301 /covet/;
    }

    location /covet/ {
        proxy_pass http://covet:5050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Old path
    location = /prices { return 301 /covet/; }
    location /prices/ { return 301 /covet/; }

    # Grove SPA under /grove/
    location /grove/ {
        try_files $uri $uri/ /grove/index.html;
    }

    # Hub landing page at /
    location = /hub.css {
        try_files /hub.css =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
