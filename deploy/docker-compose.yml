services:
  grove:
    build: ..
    image: grove:latest
    container_name: grove
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - sync

  sync:
    build: ./sync-server
    image: grove-sync:latest
    container_name: grove-sync
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - grove-sync-data:/data

volumes:
  grove-sync-data:
